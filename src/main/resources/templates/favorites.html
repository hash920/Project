
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 찜 목록</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="favorite-page">

    <h1>♥ 나의 찜 목록</h1>
    <p class="favorite-description">
        내가 관심 있는 도서를 모아볼 수 있습니다.
    </p>

    <div class="favorite-actions">
        <a href="/books">도서 목록으로 돌아가기</a>
    </div>

    <div th:if="${#lists.isEmpty(favorites)}"
         class="favorite-empty">
        <h3>아직 찜한 도서가 없습니다.</h3>
        <p>마음에 드는 도서를 찜해 보세요!</p>
        <a href="/books">도서 둘러보기</a>
    </div>

    <div th:unless="${#lists.isEmpty(favorites)}"
         class="favorite-container">

        <div th:each="favorite : ${favorites}"
             class="favorite-card">

            <h3>
                <a th:href="@{/books/{id}(id=${favorite.book.id})}"
                   th:text="${favorite.book.title}"></a>
            </h3>

            <div class="favorite-info">
                <p>
                    저자:
                    <span th:text="${favorite.book.author}"></span>
                </p>

                <p>
                    출판사:
                    <span th:text="${favorite.book.publisher}"></span>
                </p>

                <p>
                    가격:
                    <span th:text="${favorite.book.price}"></span>원
                </p>
            </div>

            <form th:action="@{/books/{id}/favorite/delete(id=${favorite.book.id})}"
                  method="post"
                  class="favorite-form"
                  onsubmit="return confirm('정말 찜 목록에서 삭제하시겠습니까?');">

                <button type="submit">♥ 찜 취소</button>

            </form>
        </div>

    </div>

</div>

</body>
</html>
