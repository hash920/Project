
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맞춤형 도서 추천</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="recommendation-page">

    <h1>나의 맞춤형 도서 추천</h1>

    <p class="recommendation-description">
        회원님의 관심 카테고리를 바탕으로 도서를 추천합니다.
    </p>

    <div th:if="${preferredCategory == null}"
         class="recommendation-empty">

        <h2>아직 찜한 도서가 없습니다.</h2>

        <p>
            도서를 찜하면 관심 카테고리를 분석하여
            맞춤형 도서를 추천해 드립니다.
        </p>

        <a href="/books">도서 목록에서 책 둘러보기</a>

    </div>

    <div th:if="${preferredCategory != null}">

        <div class="preferred-category">
            <h2>회원님의 선호 카테고리</h2>
            <p th:text="${preferredCategory}"></p>
        </div>

        <h2 class="recommendation-heading">추천 도서 목록</h2>

        <div th:if="${#lists.isEmpty(recommendedBooks)}"
             class="recommendation-empty">

            <p>추천할 도서가 없습니다.</p>

        </div>

        <div th:unless="${#lists.isEmpty(recommendedBooks)}"
             class="recommendation-grid">

            <div th:each="book : ${recommendedBooks}"
                 class="recommendation-item">

                <h3>
                    <a th:href="@{/books/{id}(id=${book.id})}"
                       th:text="${book.title}"></a>
                </h3>

                <div class="recommendation-info">

                    <p>
                        저자:
                        <span th:text="${book.author}"></span>
                    </p>

                    <p>
                        출판사:
                        <span th:text="${book.publisher}"></span>
                    </p>

                    <p>
                        가격:
                        <span th:text="${book.price}"></span>원
                    </p>

                </div>

                <div class="recommendation-rating">

                    <p>
                        평균 평점:
                        <strong>
                            <span th:text="${#numbers.formatDecimal(recommendedRatings.get(book.id), 1, 1)}"></span>점
                        </strong>
                    </p>

                    <p>
                        리뷰 개수:
                        <strong>
                            <span th:text="${recommendedReviewCounts.get(book.id)}"></span>개
                        </strong>
                    </p>

                </div>

                <div class="recommendation-reason">
                    <p>추천 이유</p>
                    <span th:text="|회원님이 선호하는 ${preferredCategory} 카테고리의 도서입니다.|"></span>
                </div>

            </div>

        </div>

    </div>

    <div class="recommendation-back">
        <a href="/books">도서 목록으로 돌아가기</a>
    </div>

</div>

</body>
</html>
