<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 수정</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<h1>도서 정보 수정</h1>

<form th:action="@{/books/{id}/edit(id=${book.id})}" method="post">

    <p>
        도서 제목:
        <input type="text" name="title"
               th:value="${book.title}" required>
    </p>

    <p>
        저자:
        <input type="text" name="author"
               th:value="${book.author}" required>
    </p>

    <p>
        출판사:
        <input type="text" name="publisher"
               th:value="${book.publisher}">
    </p>

    <p>
        가격:
        <input type="number" name="price"
               th:value="${book.price}">
    </p>

    <p>
        카테고리:
        <select name="category">
            <option value="">카테고리 선택</option>
            <option value="프로그래밍"
                    th:selected="${book.category == '프로그래밍'}">프로그래밍</option>
            <option value="소설"
                    th:selected="${book.category == '소설'}">소설</option>
            <option value="자기계발"
                    th:selected="${book.category == '자기계발'}">자기계발</option>
            <option value="경제·경영"
                    th:selected="${book.category == '경제·경영'}">경제·경영</option>
            <option value="과학"
                    th:selected="${book.category == '과학'}">과학</option>
        </select>
    </p>

    <button type="submit">수정 완료</button>

</form>

<a href="/books">도서 목록으로 돌아가기</a>

</body>
</html>
