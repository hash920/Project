
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 수정</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="book-form-page">

    <div class="book-form-card">

        <h1>도서 정보 수정</h1>

        <p class="book-form-description">
            기존 도서 정보를 수정할 수 있습니다.
        </p>

        <form th:action="@{/books/{id}/edit(id=${book.id != null ? book.id : bookId})}"
              method="post"
              class="book-input-form"
              th:object="${book}">

            <div class="book-form-group">
                <label for="title">도서 제목</label>
                <input type="text"
                       id="title"
                       th:field="*{title}"
                       maxlength="100"
                       required>
                <p class="error-message"
                   th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}"></p>
            </div>

            <div class="book-form-group">
                <label for="author">저자</label>
                <input type="text"
                       id="author"
                       th:field="*{author}"
                       maxlength="50"
                       required>
                <p class="error-message"
                   th:if="${#fields.hasErrors('author')}"
                   th:errors="*{author}"></p>
            </div>

            <div class="book-form-group">
                <label for="publisher">출판사</label>
                <input type="text"
                       id="publisher"
                       th:field="*{publisher}"
                       maxlength="50"
                       required>
                <p class="error-message"
                   th:if="${#fields.hasErrors('publisher')}"
                   th:errors="*{publisher}"></p>
            </div>

            <div class="book-form-group">
                <label for="price">가격</label>
                <input type="number"
                       id="price"
                       th:field="*{price}"
                       min="0"
                       step="1"
                       required>
                <p class="error-message"
                   th:if="${#fields.hasErrors('price')}"
                   th:errors="*{price}"></p>
            </div>

            <div class="book-form-group">
                <label for="category">카테고리</label>

                <select id="category"
                        th:field="*{category}"
                        required>

                    <option value="">카테고리 선택</option>
                    <option value="프로그래밍">프로그래밍</option>
                    <option value="소설">소설</option>
                    <option value="자기계발">자기계발</option>
                    <option value="경제·경영">경제·경영</option>
                    <option value="과학">과학</option>

                </select>

                <p class="error-message"
                   th:if="${#fields.hasErrors('category')}"
                   th:errors="*{category}"></p>
            </div>

            <button type="submit">수정 완료</button>

        </form>

        <div class="book-form-footer">
            <a href="/books">도서 목록으로 돌아가기</a>
        </div>

    </div>

</div>

</body>
</html>
